name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/exec_board
  # The migration-created default (prisma/migrations/*_tenancy_rls) — fine
  # to use as-is in CI's ephemeral DB; only local/persistent dev DBs need
  # the real rotation in scripts/setup-db-role.sh.
  APP_DATABASE_URL: postgresql://exec_board_app:changeme-rotate-immediately@localhost:5432/exec_board

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exec_board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exec_board"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exec_board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exec_board"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Seed two test users with passwords
        env:
          USER1: e2e-ci-user-1
          PASSWORD1: e2e-ci-password-1
          USER2: e2e-ci-user-2
          PASSWORD2: e2e-ci-password-2
        run: |
          node scripts/set-password.mts --from-env
          printf 'USER1=%s\nPASSWORD1=%s\nUSER2=%s\nPASSWORD2=%s\n' "$USER1" "$PASSWORD1" "$USER2" "$PASSWORD2" >> "$GITHUB_ENV"
      - name: Start the app
        run: |
          npm run start &
          for i in $(seq 1 30); do curl -sf http://localhost:3300/api/health && break; sleep 1; done
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  prisma-migrate-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exec_board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exec_board"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx prisma migrate deploy
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
