services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: exec-board-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - exec-board-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3300:3300"
    container_name: exec-board-web
    environment:
      NODE_ENV: development
      # Passed straight through from .env — local dev connects to the same
      # Neon database as production, not the local db service below.
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      # Docker Desktop's bridge network advertises IPv6 addresses for Neon's
      # host that it can't actually route, so Node's Happy Eyeballs races an
      # unreachable AAAA record against the working A record and the whole
      # connection attempt times out. Disabling autoselection forces a plain
      # IPv4 connect.
      NODE_OPTIONS: --no-network-family-autoselection
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # sync: pushed straight into the running container; Next's own dev
        # server (Turbopack) picks up the change and hot-reloads — no
        # rebuild needed, which is what makes this fast.
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./lib
          target: /app/lib
        - action: sync
          path: ./packages/board-codec/src
          target: /app/packages/board-codec/src
        # next.config.ts isn't picked up by npm/prisma, but it does need to
        # reach the container — Next's dev server watches it itself and
        # restarts on change, a full image rebuild isn't necessary.
        - action: sync
          path: ./next.config.ts
          target: /app/next.config.ts
        # rebuild: anything that changes what `npm ci` or `prisma generate`
        # produced — a sync can't fix that, the image has to be rebuilt.
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: prisma/schema.prisma

  studio:
    build: .
    restart: unless-stopped
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none"]
    container_name: exec-board-studio
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      # Deliberately DATABASE_URL (the postgres superuser), not
      # APP_DATABASE_URL — RLS (TR-15) is a no-op for superusers, so this is
      # what makes Studio show every row instead of nothing (exec_board_app
      # sees zero board-scoped rows unless app.current_user_id is set).
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

volumes:
  exec-board-db:
